name: video_telemetry
description: >-
  A metrics layer for VideoPlayerController. Measures time-to-first-frame,
  buffer stalls, rebuffering ratio, and segment switches safely.
version: 0.1.4
homepage: https://github.com/jayeshbhole7/flutter_video_telemetry
repository: https://github.com/jayeshbhole7/flutter_video_telemetry
issue_tracker: https://github.com/jayeshbhole7/flutter_video_telemetry/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
